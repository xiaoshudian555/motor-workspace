schema_version: 2
name: motor-workspace-environment
# 所有部署模式都必须存在的 API 资源（硬性）
required_api_resources:
  - name: podgroups
    api_group: scheduling.volcano.sh
# 按 motor_deploy_config.deploy_mode 额外硬性要求的 API 资源
deploy_mode_api_resources:
  infer_service_set: []
  multi_deployment: []
  single_container: []
# 按 deploy_mode 的 one-of API 资源组：组内任一存在即通过（记录命中项）
deploy_mode_api_resource_groups:
  infer_service_set:
    - name: motor_workload_api
      alternatives:
        - name: inferservicesets
          api_group: mindcluster.huawei.com
        - name: ascendjobs
          api_group: mindxdl.gitee.com
  multi_deployment: []
  single_container: []
# 所有部署模式都必须存在的组件（存在性探测）
component_patterns:
  - noded
  - clusterd
  - ascend-device-plugin
  - volcano
# 按 deploy_mode 额外硬性要求的组件
deploy_mode_components:
  infer_service_set: []
  multi_deployment: []
  single_container: []
# 按 deploy_mode 的 one-of 组件组：组内任一存在即通过（记录命中项）
deploy_mode_component_groups:
  infer_service_set:
    - name: motor_operator
      alternatives:
        - infer-operator
        - ascend-operator
  multi_deployment: []
  single_container: []
npu_resource_name: huawei.com/Ascend910
scheduler_name: volcano
